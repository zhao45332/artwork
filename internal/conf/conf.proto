syntax = "proto3";
package kratos.api;

option go_package = "artwork/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
  }
  message MinIO {
    string endpoint = 1;
    string access_key_id = 2;
    string secret_access_key = 3;
    bool use_ssl = 4;
    string bucket_name = 5;
  }
  message Auth {
    string jwt_secret = 1;
    google.protobuf.Duration access_token_expire = 2;
    google.protobuf.Duration refresh_token_expire = 3;
  }
  Database database = 1;
  Redis redis = 2;
  MinIO minio = 3;
  Auth auth = 4;
}
