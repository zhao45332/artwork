syntax = "proto3";

package artwork.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "artwork/api/artwork/v1;v1";
option java_multiple_files = true;
option java_package = "dev.kratos.api.artwork.v1";
option java_outer_classname = "ArtworkProtoV1";

service ArtworkService {
  rpc CreateArtwork (CreateArtworkRequest) returns (CreateArtworkReply) {
    option (google.api.http) = {
      post: "/v1/artworks"
      body: "*"
    };
  }

  rpc UpdateArtwork (UpdateArtworkRequest) returns (UpdateArtworkReply) {
    option (google.api.http) = {
      put: "/v1/artworks/{id}"
      body: "*"
    };
  }

  rpc DeleteArtwork (DeleteArtworkRequest) returns (DeleteArtworkReply) {
    option (google.api.http) = {
      delete: "/v1/artworks/{id}"
    };
  }

  rpc GetArtwork (GetArtworkRequest) returns (GetArtworkReply) {
    option (google.api.http) = {
      get: "/v1/artworks/{id}"
    };
  }

  rpc SearchArtwork (SearchArtworkRequest) returns (SearchArtworkReply) {
    option (google.api.http) = {
      get: "/v1/artworks"
    };
  }

  rpc GetMyArtworks (GetMyArtworksRequest) returns (SearchArtworkReply) {
    option (google.api.http) = {
      get: "/v1/me/artworks"
    };
  }

  rpc UploadImage (UploadImageRequest) returns (UploadImageReply) {
    option (google.api.http) = {
      post: "/v1/artworks/upload"
      body: "*"
    };
  }
}

message ArtworkImage {
  int64 id = 1;
  string url = 2;
  bool is_cover = 3;
  int32 sort_order = 4;
}

message ArtworkInfo {
  int64 id = 1;
  int64 user_id = 2;
  string username = 3;
  string user_nickname = 4;
  string user_avatar_url = 5;
  string title = 6;
  string description = 7;
  string author = 8;
  int32 year = 9;
  double width = 10;
  double height = 11;
  string material = 12;
  double price = 13;
  bool is_collected = 14;
  string location = 15;
  string style = 16;
  string technique = 17;
  string image_url = 18;
  string cover_image_url = 19;
  int64 category_id = 20;
  string category_name = 21;
  repeated string tags = 22;
  repeated ArtworkImage images = 23;
  int32 status = 24;
  int32 visibility = 25;
  int64 view_count = 26;
  int64 like_count = 27;
  int64 favorite_count = 28;
  int64 comment_count = 29;
  int64 share_count = 30;
  google.protobuf.Timestamp publish_at = 31;
  google.protobuf.Timestamp created_at = 32;
  google.protobuf.Timestamp updated_at = 33;
}

message CreateArtworkRequest {
  string title = 1;
  string description = 2;
  string author = 3;
  int32 year = 4;
  double width = 5;
  double height = 6;
  string material = 7;
  double price = 8;
  bool is_collected = 9;
  string location = 10;
  string style = 11;
  string technique = 12;
  string image_url = 13;
  int64 category_id = 14;
  repeated string tags = 15;
  repeated string image_urls = 16;
  string cover_image_url = 17;
  int32 status = 18;
  int32 visibility = 19;
}

message CreateArtworkReply {
  ArtworkInfo artwork = 1;
}

message UpdateArtworkRequest {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string author = 4;
  int32 year = 5;
  double width = 6;
  double height = 7;
  string material = 8;
  double price = 9;
  bool is_collected = 10;
  string location = 11;
  string style = 12;
  string technique = 13;
  string image_url = 14;
  int64 category_id = 15;
  repeated string tags = 16;
  repeated string image_urls = 17;
  string cover_image_url = 18;
  int32 status = 19;
  int32 visibility = 20;
}

message UpdateArtworkReply {
  ArtworkInfo artwork = 1;
}

message DeleteArtworkRequest {
  int64 id = 1;
}

message DeleteArtworkReply {
  bool success = 1;
}

message GetArtworkRequest {
  int64 id = 1;
}

message GetArtworkReply {
  ArtworkInfo artwork = 1;
}

message SearchArtworkRequest {
  string keyword = 1;
  int32 year_from = 2;
  int32 year_to = 3;
  double width_min = 4;
  double width_max = 5;
  double height_min = 6;
  double height_max = 7;
  double price_min = 8;
  double price_max = 9;
  int64 category_id = 10;
  repeated string tags = 11;
  int32 page = 12;
  int32 page_size = 13;
  string sort_by = 14;
  string sort_order = 15;
  int64 user_id = 16;
  int32 visibility = 17;
  int32 status = 18;
}

message SearchArtworkReply {
  repeated ArtworkInfo artworks = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetMyArtworksRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 status = 3;
}

message UploadImageRequest {
  string filename = 1;
  bytes content = 2;
  string content_type = 3;
}

message UploadImageReply {
  string url = 1;
  string filename = 2;
}
